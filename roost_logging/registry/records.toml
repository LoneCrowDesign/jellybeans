# Record types for the birdoscope ecosystem log contract.
#
# A record type is a set of fields that share one meaning for what a row is.
# Devices differ in which fields of a type they populate, never by writing a
# variant of the type. A per-frame observation and a per-device census are
# different records even where their field names agree, so no count mixes
# per-frame and per-device totals.
#
# `fields` is the canonical order. A device emits its columns in this order and
# omits any it does not populate. Ingest dispatches on column names, and the
# build enforces the order, so a device that reorders columns fails to build.
#
# Every device that emits a type populates its `required` fields. A device that
# cannot populate one does not emit the type.
#
# `restrict.<field>` narrows an enum field's legal values for one record type.
# `detection_method` covers both radios, and the restriction keeps a BLE value
# such as `ble_oui` off a Wi-Fi row.
#
# One file per record type per session, named <record>.v<version>.csv inside the
# session directory.
#
# See docs/design_spec.md.

# ---------------------------------------------------------------------------

[[record]]
name = "wifi_obs"
requires = ["wifi"]
version = 2
family = "observation"
devices = ["scan_logger", "bscope_analyze", "bscope_wardriver"]
description = """
One Wi-Fi observation, either a received frame in promiscuous mode or a device \
present in a scan window in scan mode. `obs_mode` says which, and so what the \
row, its RSSI and its timestamp mean.

All listed devices share this type, and the field set is the union of what they \
populate. Scan mode reports `auth_mode` without parsing a frame, and promiscuous \
mode reports the frame layer, which scan mode never sees.

Version 2 removed `freq_mhz`, which derives from `channel` and `band` on the same \
row. Frequency derivation lives in runtime/, per docs/design_spec.md section 3.1. \
`channel` is the raw driver value and joins to config_change's channel plan, and \
`band` separates the channel numbers that 2.4 GHz and 6 GHz share. The \
`freq_mhz` identifier is retired and never reused."""
fields = [
  "timestamp_utc", "uptime_ms", "fix_seq",
  "cap_component", "obs_mode", "mac", "detection_method", "frame_subtype",
  "rssi", "channel", "band",
  "ssid", "auth_mode",
  "addr1", "addr2", "addr3", "seq", "fc_flags", "frame_len", "bb_format",
  "cap_info", "beacon_interval", "ie_ids", "vendor_ies",
]
required = ["uptime_ms", "cap_component", "obs_mode", "mac", "rssi"]
restrict.detection_method = [
  "oui_addr1", "oui_addr2", "oui_addr3", "ssid_match",
  "wildcard_probe", "directed_probe", "ie_match", "unmatched",
  "operator_survey",
]

[[record]]
name = "wifi_obs"
version = 1
retired = true
requires = ["wifi"]
family = "observation"
devices = ["scan_logger", "bscope_analyze", "bscope_wardriver"]
description = """
Superseded by v2, which removed `freq_mhz`. Kept so captures written under v1 \
stay readable, as docs/design_spec.md section 3.5 promises. A consumer dispatches \
on `record` and `version`, and this definition gives v1 files their fields and \
`freq_mhz` its type.

A retired record is read-only. The generator and the registry hash both skip it, \
so no device can emit it and it cannot force a reflash. Only one version of a \
record name is live at a time. Devices compile against that one, and consumers \
read the retired blocks as an archive.

Never edit a retired block to match a later format. It describes bytes already \
written to cards."""
fields = [
  "timestamp_utc", "uptime_ms", "fix_seq",
  "cap_component", "obs_mode", "mac", "detection_method", "frame_subtype",
  "rssi", "channel", "band", "freq_mhz",
  "ssid", "auth_mode",
  "addr1", "addr2", "addr3", "seq", "fc_flags", "frame_len", "bb_format",
  "cap_info", "beacon_interval", "ie_ids", "vendor_ies",
]
required = ["uptime_ms", "cap_component", "obs_mode", "mac", "rssi"]
restrict.detection_method = [
  "oui_addr1", "oui_addr2", "oui_addr3", "ssid_match",
  "wildcard_probe", "directed_probe", "ie_match", "unmatched",
]

[[record]]
name = "ble_obs"
requires = ["ble"]
version = 1
family = "observation"
devices = ["scan_logger", "bscope_analyze", "bscope_wardriver"]
description = """
One BLE observation, either a received advertisement in promiscuous mode or a \
device present in a scan window in scan mode.

The field set is the full union from version 1, including the PDU-layer detail \
only a promiscuous capture reaches. A device that cannot populate a field does \
not declare it, so the field never appears in that device's header or rows.

The type has no `ssid` and no `channel`. A BLE local name is not a network name, \
so it has its own field, `device_name`. A BLE advertising channel is not an \
802.11 channel, and no device in the set reports one."""
fields = [
  "timestamp_utc", "uptime_ms", "fix_seq",
  "cap_component", "obs_mode", "mac", "addr_type", "detection_method",
  "rssi", "tx_power",
  "device_name",
  "pdu_type", "phy_primary", "phy_secondary", "sid", "active_scan",
  "adv_data_hex",
]
required = ["uptime_ms", "cap_component", "obs_mode", "mac", "rssi"]
restrict.detection_method = ["ble_oui", "ble_mfr", "unmatched", "operator_survey"]

[[record]]
name = "gps_track"
requires = ["gnss"]
version = 1
family = "context"
devices = ["scan_logger", "bscope_analyze", "bscope_wardriver"]
description = """
One GPS fix, and the authoritative record of where the device was. Observation \
rows reference it by `fix_seq` and carry no position of their own.

A device writes one row per fix whether or not it observed anything. A gap in \
observations against a continuous track then shows nothing was there, while the \
same gap with no track is unknown."""
fields = [
  "timestamp_utc", "uptime_ms", "fix_seq", "cap_component", "position_source",
  "lat", "lon", "alt_m",
  "speed_mps", "course_deg",
  "hdop", "sats", "fix_type", "fix_age_ms",
]
required = ["uptime_ms", "cap_component", "fix_seq", "position_source"]

[[record]]
name = "device_event"
family = "device"
version = 1
devices = ["scan_logger", "bscope_analyze", "bscope_wardriver"]
description = """
One device-level event that is not an observation, such as boot, clock anchor, \
storage failure, buffer overflow or shutdown.

It records a degraded capture as a fact in the session, so a truncated capture \
reads differently from a quiet one."""
fields = [
  "timestamp_utc", "uptime_ms", "fix_seq",
  "cap_component", "event_kind", "event_count", "event_detail",
]
required = ["uptime_ms", "cap_component", "event_kind"]

[[record]]
name = "config_change"
version = 1
family = "context"
devices = ["scan_logger", "bscope_analyze", "bscope_wardriver"]
description = """
One runtime setting taking a new value. The file holds transitions only, with no \
periodic row, and the operator-facing heartbeat is never logged.

A device writes every setting once at boot with its initial value. The state at \
time T is then the last row per setting with `uptime_ms` at or below T, which is \
always defined, so this file alone says what the device was doing at any instant, \
the first interval included.

Each setting is a row of one key and one value, so adding a setting needs no \
record version bump. The runtime section of manifest.toml defines the settings.

A device writes a handful of rows at boot, then one per real change. Re-applying \
a setting's current value writes no row.

Readers resolve a setting by timestamp. Position differs, since observation rows \
reference it through `fix_seq`. A configuration exists at every instant, so the \
last transition before a row is exact. A GPS fix does not always exist, so \
position needs the explicit reference."""
fields = [
  "timestamp_utc", "uptime_ms", "fix_seq",
  "cap_component", "setting", "value",
]
required = ["uptime_ms", "cap_component", "setting"]

[[record]]
name = "operator_mark"
requires = ["operator_mark"]
version = 1
family = "annotation"
devices = ["bscope_analyze"]
description = """
The operator flagged a place.

A mark means the operator saw something worth returning to. Analysis asks what \
was in range at the mark, and answers by joining other captures against it.

A mark has no observed device, so the record has no `mac`, `rssi` or \
`detection_method`. The row's existence is the information, and its content is \
when and where.

The record has no `mark_seq`, since the operator's Nth mark is the Nth row.

`fix_seq` is optional, so a device with no GNSS can still mark. A co-located \
device's track supplies a time-only mark's position, and consumers resolve it.

Every press writes a row, including repeats. A press is an event, and two \
presses may mean two things."""
fields = [
  "timestamp_utc", "uptime_ms", "fix_seq", "cap_component",
]
required = ["uptime_ms", "cap_component"]
