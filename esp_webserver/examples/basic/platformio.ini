; Minimal example that exercises the WebConsole drop-in. From this folder:
;   pio run                 # compile
;   pio run -t upload -t monitor
;
; The pioarduino platform fork is required for Arduino-ESP32 3.x / IDF 5.x; the
; ESP32Async libraries below do not build against the old me-no-dev repos on it.
[env:esp32-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
build_flags = -DBOARD_HAS_PSRAM=1

; Pull in the WebConsole library that lives two directories up (the jellybean),
; plus its async + JSON dependencies.
lib_extra_dirs = ${PROJECT_DIR}/../..
lib_deps =
  ESP32Async/ESPAsyncWebServer @ ^3.11.2
  ESP32Async/AsyncTCP @ ^3.4.10
  bblanchon/ArduinoJson @ ^7
